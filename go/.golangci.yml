# golangci-lint configuration for KoboldCpp Go bindings

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - examples
  skip-files:
    - "examples/.*\\.go$"

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - unused        # Check for unused code
    - gofmt         # Check formatting
    - goimports     # Check imports
    - misspell      # Check for misspelled words
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Check for unused function parameters
    - gosec         # Security checks
    - gocritic      # Comprehensive Go linter
    - revive        # Fast, configurable, extensible linter

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true
    enable-all: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/kawai-network/koboldcpp

  misspell:
    locale: US

  gosec:
    excludes:
      - G304 # File path provided as taint input (we need this for file operations)
      - G401 # Use of weak cryptographic primitive (not applicable for our use case)

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnamedResult
      - hugeParam

  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    
    # Exclude example files from some checks
    - path: examples/
      linters:
        - errcheck
        - gosec

  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
