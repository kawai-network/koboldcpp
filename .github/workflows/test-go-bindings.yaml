name: Go Bindings Tests

on:
  push:
    branches:
      - concedo
      - concedo_experimental
      - go-binding-v2
      - consolidate-integration-tests
    paths:
      - 'go/**'
      - 'expose.cpp'
      - 'expose.h'
      - 'otherarch/whispercpp/**'
      - 'otherarch/sdcpp/**'
      - 'Makefile'
      - '.github/workflows/test-go-bindings.yaml'
  pull_request:
    branches:
      - concedo
      - concedo_experimental
      - go-binding-v2
      - consolidate-integration-tests
    paths:
      - 'go/**'
      - 'expose.cpp'
      - 'expose.h'
      - 'otherarch/whispercpp/**'
      - 'otherarch/sdcpp/**'
      - 'Makefile'
      - '.github/workflows/test-go-bindings.yaml'
  workflow_dispatch:

jobs:
  test-go-bindings-linux:
    name: Test Go Bindings (Linux)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: go/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg

      - name: Build KoboldCpp library (CPU only with SD support)
        run: |
          # Build with SD support for testing
          make koboldcpp_default LLAMA_PORTABLE=1 LLAMA_SD=1
          ls -lh *.so

      - name: Download test models
        run: |
          mkdir -p models
          # Download Whisper tiny model for fast testing
          wget -q https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -O models/whisper-tiny.bin
          # Download SD model (SDXS-512-0.9) with retry logic
          curl -L --retry 3 --retry-delay 5 \
            -o models/sdxs-512.safetensors \
            https://huggingface.co/IDKiro/sdxs-512-0.9/resolve/main/sdxs-512-0.9.safetensors || {
            echo "SD model download failed"
            rm -f models/sdxs-512.safetensors
          }
          # Verify SD model file size (should be ~600MB)
          if [ -f models/sdxs-512.safetensors ]; then
            FILE_SIZE=$(stat -c%s models/sdxs-512.safetensors 2>/dev/null || stat -f%z models/sdxs-512.safetensors 2>/dev/null || echo 0)
            echo "SD model file size: $FILE_SIZE bytes"
            if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "SD model too small, download likely failed"
              rm -f models/sdxs-512.safetensors
            fi
          fi
          ls -lh models/

      - name: Generate test audio
        run: |
          # Generate a simple test audio file
          ffmpeg -f lavfi -i "sine=frequency=1000:duration=2" -ac 1 -ar 16000 test_audio.wav -y

      - name: Verify Go module
        working-directory: go
        run: |
          go mod download
          go mod verify

      - name: Run Go tests
        working-directory: go
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./go/coverage.out
          flags: go-bindings
          name: whisper-go-bindings
          fail_ci_if_error: false

      - name: Build examples
        working-directory: go
        run: |
          go build -v -o examples/whisper_example ./examples/whisper_example.go
          go build -v -o examples/simple_whisper ./examples/simple_whisper.go
          go build -v -o examples/sd_example ./examples/sd_example.go
          go build -v -o examples/sd_img2img_example ./examples/sd_img2img_example.go
          go build -v -o examples/llama_example ./examples/llama_example.go
          ls -lh examples/

      - name: Run integration tests
        working-directory: go
        run: |
          cat > integration_test.go << 'EOF'
          package koboldcpp
          import ("os"; "testing")
          
          func TestWhisperIntegration(t *testing.T) {
              kcpp := New()
              if err := kcpp.LoadLibrary(LibDefault, ".."); err != nil {
                  t.Fatalf("Failed to load library: %v", err)
              }
              defer kcpp.Close()
              if err := kcpp.LoadWhisperModel(WhisperLoadModelInputs{
                  ModelFilename: "../models/whisper-tiny.bin",
                  ExecutablePath: "..",
                  Quiet: true,
              }); err != nil {
                  t.Fatalf("Failed to load model: %v", err)
              }
              result, err := kcpp.WhisperTranscribeFile("../test_audio.wav", "en", "")
              if err != nil {
                  t.Fatalf("Transcription failed: %v", err)
              }
              t.Logf("Transcription: %s (status: %d)", result.Text, result.Status)
              if result.Status != 1 {
                  t.Errorf("Expected status 1, got %d", result.Status)
              }
          }
          
          func TestSDIntegration(t *testing.T) {
              kcpp := New()
              if err := kcpp.LoadLibrary(LibDefault, ".."); err != nil {
                  t.Fatalf("Failed to load library: %v", err)
              }
              defer kcpp.Close()
              
              modelPath := "../models/sdxs-512.safetensors"
              fileInfo, err := os.Stat(modelPath)
              if os.IsNotExist(err) {
                  t.Skip("SD model not available, skipping test")
              }
              if err != nil {
                  t.Skipf("Cannot stat model file: %v", err)
              }
              if fileInfo.Size() < 1000000 {
                  t.Skipf("Model file too small (%d bytes), download failed", fileInfo.Size())
              }
              
              t.Log("Loading SD model...")
              if err := kcpp.LoadSDModel(SDLoadModelInputs{
                  ModelFilename: modelPath,
                  ExecutablePath: "..",
                  Threads: 4,
                  Quiet: false,
              }); err != nil {
                  t.Fatalf("Failed to load SD model: %v", err)
              }
              
              t.Log("Generating test image...")
              result, err := kcpp.SDGenerate(SDGenerationInputs{
                  Prompt: "a simple red circle",
                  Width: 512,
                  Height: 512,
                  SampleSteps: 1,
                  Seed: 42,
                  CFGScale: 1.0,
              })
              if err != nil {
                  t.Fatalf("SD generation failed: %v", err)
              }
              
              t.Logf("SD generation status: %d, data length: %d bytes", result.Status, len(result.Data))
              if result.Status != 1 {
                  t.Errorf("Expected status 1, got %d", result.Status)
              }
              if len(result.Data) == 0 {
                  t.Error("Generated image data is empty")
              }
          }
          EOF
          go test -v -run "TestWhisperIntegration|TestSDIntegration" -timeout 10m

