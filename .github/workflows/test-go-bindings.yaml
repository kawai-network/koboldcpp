  lint-go-code:
    name: Lint Go Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: go/go.sum

      - name: Run go vet
        working-directory: go
        run: go vet -unsafeptr=false $(go list ./... | grep -v /examples)

      - name: Run go fmt check
        working-directory: go
        run: |
          # Check formatting, excluding examples directory
          FILES=$(find . -name '*.go' -not -path './examples/*')
          if [ -n "$FILES" ]; then
            UNFORMATTED=$(gofmt -l $FILES)
            if [ -n "$UNFORMATTED" ]; then
              echo "Go code is not formatted:"
              gofmt -d $FILES
              exit 1
            fi
          fi

  benchmark:
    name: Benchmark Go Bindings
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/concedo'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg

      - name: Build KoboldCpp library
        run: |
          make LLAMA_PORTABLE=1

      - name: Download Whisper model
        run: |
          mkdir -p models
          wget -q https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -O models/whisper-tiny.bin

      - name: Generate test audio
        run: |
          ffmpeg -f lavfi -i "sine=frequency=1000:duration=3" -ac 1 -ar 16000 test_audio.wav -y

      - name: Run benchmarks
        working-directory: go
        run: |
          go test -bench=. -benchmem -benchtime=3x -run=^$ | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: go/benchmark.txt
